<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Fluxograma uMode</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; overflow:hidden; height:100%; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg,#f5f7fa,#eef1f5); display:flex; flex-direction:column; }
  #header { text-align:center; padding:14px 20px 6px; flex:0 0 auto; }
  h1 { color:#2d2d3a; margin:0; font-size:22px; }
  p.subtitle { text-align:center; color:#666; margin:2px 0 0; font-size:13px; }
  #stage { flex:1 1 auto; min-width:0; min-height:0; width:100%; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  #scaler { transform-origin: center center; position:relative; }
  .node-row { display:flex; align-items:center; position:relative; }
  .node-children { display:flex; flex-direction:column; justify-content:center; gap:16px; margin-left:56px; position:relative; }
  .node-box {
    display:inline-flex; align-items:center; justify-content:center; padding:10px 16px; border-radius:12px; cursor:pointer;
    font-size:13px; font-weight:600; color:#fff; white-space:nowrap; position:relative; z-index:2;
    box-shadow:0 3px 8px rgba(0,0,0,0.18); border:2px solid rgba(255,255,255,0.5);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .node-box:hover { transform: scale(1.04); box-shadow:0 8px 16px rgba(0,0,0,0.28); }
  .lvl0 { background:#4c1d95; padding:12px 22px; }
  .lvl1 { background:#5b47e0; }
  .lvl2 { background:#3d8bfd; }
  .lvl3 { background:#2bb673; }
  .lvl4 { background:#f2994a; font-weight:500; font-size:12px; }
  .isexample { background:#f2994a !important; font-weight:500; font-size:12px; }
  #connectors { position:absolute; top:0; left:0; z-index:1; pointer-events:none; }
  #overlay {
    position:fixed; inset:0; background:rgba(20,20,30,0.55); display:none;
    align-items:center; justify-content:center; z-index:999;
  }
  #modal {
    background:#fff; border-radius:16px; max-width:480px; width:90%; padding:28px 30px;
    box-shadow:0 20px 60px rgba(0,0,0,0.35); position:relative; animation: pop .18s ease-out;
  }
  @keyframes pop { from { transform:scale(.92); opacity:0;} to {transform:scale(1); opacity:1;} }
  #modal h2 { margin:0 0 12px; color:#2d2d3a; font-size:20px; }
  #modal p { color:#444; line-height:1.5; font-size:15px; margin:0; }
  #modal button { position:absolute; top:14px; right:16px; border:none; background:none; font-size:20px; cursor:pointer; color:#888; }
  #modal button:hover { color:#222; }
  .legend { text-align:center; color:#888; font-size:12px; margin:4px 0 0; flex:0 0 auto; padding-bottom:8px; }
</style>
</head>
<body>
  <div id="header">
    <h1>uMode — Estrutura</h1>
    <p class="subtitle">Clique em qualquer item do fluxograma para ver a explicação</p>
  </div>
  <div id="stage"><div id="scaler"></div></div>
  <p class="legend">💡 Todos os quadros são clicáveis</p>
  <div id="overlay">
    <div id="modal">
      <button id="closeModal">✕</button>
      <h2 id="modalTitle"></h2>
      <p id="modalDesc"></p>
    </div>
  </div>

function isExample(name){ return /^ex\.?\s*[:.]?/i.test(name.trim()); }

var scaler = document.getElementById('scaler');
var pairs = [];

function buildNode(node){
  var row = document.createElement('div');
  row.className = 'node-row';
  var box = document.createElement('div');
  var colorClass = (node.level !== 0 && isExample(node.name)) ? 'isexample' : ('lvl' + node.level);
  box.className = 'node-box ' + colorClass;
  box.dataset.name = node.name;
  box.dataset.desc = node.desc;
  if (node.level === 0){
    var img = document.createElement('img');
    img.src = LOGO_URL;
    img.alt = 'uMode';
    img.style.height = '30px';
    img.style.display = 'block';
    img.draggable = false;
    box.appendChild(img);
  } else {
    box.textContent = node.name;
  }
  box.addEventListener('click', function(e){
    e.stopPropagation();
    document.getElementById('modalTitle').textContent = box.dataset.name;
    document.getElementById('modalDesc').textContent = box.dataset.desc;
    document.getElementById('overlay').style.display = 'flex';
  });
  row.appendChild(box);
  if (node.children && node.children.length){
    var childrenWrap = document.createElement('div');
    childrenWrap.className = 'node-children';
    node.children.forEach(function(child){
      var childRow = buildNode(child);
      childrenWrap.appendChild(childRow);
      pairs.push({parentBox: box, childBox: childRow.querySelector('.node-box')});
    });
    row.appendChild(childrenWrap);
  }
  return row;
}

var rootRow = buildNode(data);
scaler.appendChild(rootRow);

function drawConnectors(){
  var old = document.getElementById('connectors');
  if (old) old.remove();
  var scalerRect = scaler.getBoundingClientRect();
  var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.id = 'connectors';
  var w = scaler.scrollWidth;
  var h = scaler.scrollHeight;
  svg.setAttribute('width', w);
  svg.setAttribute('height', h);
  svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
  pairs.forEach(function(p){
    var pr = p.parentBox.getBoundingClientRect();
    var cr = p.childBox.getBoundingClientRect();
    var x1 = pr.right - scalerRect.left;
    var y1 = pr.top + pr.height/2 - scalerRect.top;
    var x2 = cr.left - scalerRect.left;
    var y2 = cr.top + cr.height/2 - scalerRect.top;
    var midX = x1 + (x2 - x1) / 2;
    var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    var d = 'M ' + x1 + ' ' + y1 + ' H ' + midX + ' V ' + y2 + ' H ' + x2;
    path.setAttribute('d', d);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', '#b9c0cc');
    path.setAttribute('stroke-width', '2');
    svg.appendChild(path);
  });
  scaler.insertBefore(svg, scaler.firstChild);
}
drawConnectors();

function fitToScreen(){
  var stage = document.getElementById('stage');
  scaler.style.transform = 'scale(1)';
  drawConnectors();
  var naturalWidth = scaler.scrollWidth;
  var naturalHeight = scaler.scrollHeight;
  var availableWidth = stage.clientWidth - 16;
  var availableHeight = stage.clientHeight - 16;
  var scale = Math.min(availableWidth / naturalWidth, availableHeight / naturalHeight, 1);
  scaler.style.transform = 'scale(' + scale + ')';
}
fitToScreen();
window.addEventListener('resize', fitToScreen);
setTimeout(fitToScreen, 150);

document.getElementById('closeModal').addEventListener('click', function(){
  document.getElementById('overlay').style.display = 'none';
});
document.getElementById('overlay').addEventListener('click', function(e){
  if (e.target.id === 'overlay') e.target.style.display = 'none';
});
